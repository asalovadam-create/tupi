<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041a4a">
<title>P2P Guardian</title>
<link rel="stylesheet" href="/static/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 10h19" stroke="currentColor" stroke-width="1.8"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v14m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V6m0 0l-5 5m5-5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-chip" viewBox="0 0 40 30"><rect width="40" height="30" rx="6" fill="url(#chipg)"/><path d="M0 10h40M0 20h40M14 0v30M26 0v30" stroke="rgba(0,0,0,.25)" fill="none"/><defs><linearGradient id="chipg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e7b4"/><stop offset="1" stop-color="#b8923c"/></linearGradient></defs></symbol>
</defs></svg>

<aside class="side glass">
  <div class="logo"><svg class="ic"><use href="#i-shield"/></svg><b>P2P Guardian</b></div>
  <nav>
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>Главная</a>
    <a href="#/cards" data-nav="cards"><svg class="ic"><use href="#i-card"/></svg>Мои карты</a>
  </nav>
  <button class="gbtn primary" data-act="add-card"><svg class="ic"><use href="#i-plus"/></svg>Добавить карту</button>
  <p class="soon">Скоро: AI Guardian, новости, документы, уведомления</p>
</aside>

<main id="app"></main>

<nav class="tabbar glass">
  <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Главная</span></a>
  <button class="fab gbtn primary" data-act="add-card" aria-label="Добавить карту"><svg class="ic"><use href="#i-plus"/></svg></button>
  <a href="#/cards" data-nav="cards"><svg class="ic"><use href="#i-card"/></svg><span>Карты</span></a>
</nav>

<div id="modal" class="modal" hidden><div class="sheet glass" role="dialog"></div></div>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
